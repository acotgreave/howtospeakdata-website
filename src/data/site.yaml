about:
  heading: "Andy Cotgreave"
  # Basic HTML (<em>, <a>) is allowed in these paragraphs.
  paragraphs:
    - "Author and independent data advisor. I've spent 20 years persuading people to enjoy data instead of enduring it. As a leader in data communication at Tableau for 15 years, I helped thousands of analysts, executives and teams turn confusing numbers into rational decisions."
    - "Now I'm focused on how AI is reshaping what it means to be data literate — and what it means for the humans in the room."
    - "I present <em>The AI Analyst</em>, a series exploring AI's impact on our field. I'm co-author of <em>Dashboards That Deliver</em> and <em>The Big Book of Dashboards</em>, I write the <em>How To Speak Data</em> newsletter, and I co-host <em>Chart Chat</em>, a monthly series on data communication."

work:
  heading: "Tell me what you need."
  text: "Want a keynote speaker? Or an emcee? Check. Brand partnerships on The AI Analyst? Check. Mentoring services (dashboards or presentations). Yes please! Grab 30 minutes and we'll work out which one you need."
