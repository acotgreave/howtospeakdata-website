speaking:
  heading: "I've keynoted at events on four continents."
  paragraphs:
    - "My philosophy is to inform, educate and entertain. My keynotes are suitable for any audience: everyone encounters data during their work day. I take inspiration from all disciplines and weave narratives that fit contemporary trends."
    - "I also emcee events, and I'm good at it. If your event needs a thread running through two days, that's a real skill and I have it."
  topics:
    - title: "AI, Data and Society"
      text: "The honest state of AI in analytics: what works, what's theatre, what to do on Monday."
      url: ""
    - title: "Data Communication"
      text: "Twenty years of what actually persuades people, distilled into things you can use."
      url: ""
    - title: "The History of Data"
      text: "Nothing is new in analytics. A talk that makes today's hype legible by looking back."
      url: ""
    - title: "Event emcee"
